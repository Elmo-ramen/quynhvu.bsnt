<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go-live Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfcfa;--surface:#ffffff;--surface2:#f5f8f4;--ink:#12261b;--muted:#5f7167;--line:#e2e9e2;
  --brand:#15803d;--brand-d:#0b3d2a;--brand-l:#dcfce7;
  --accent:#ea580c;--accent-d:#c2410c;--accent-l:#ffedd5;
  --red:#dc2626;--redbg:#fee2e2;--amber:#b45309;--amberbg:#fef3c7;--green:#15803d;--greenbg:#dcfce7;--orange:#c2410c;--orangebg:#ffedd5;
  --shadow:0 1px 2px rgba(11,61,42,.05),0 10px 30px rgba(11,61,42,.07);
  --grad:linear-gradient(90deg,#15803d,#ea580c);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1511;--surface:#13201a;--surface2:#192a22;--ink:#ecf5ef;--muted:#92a89b;--line:#243830;
    --brand:#4ade80;--brand-d:#052e1a;--brand-l:#14532d;
    --accent:#fb923c;--accent-d:#fdba74;--accent-l:#431407;
    --red:#f87171;--redbg:#3b1d1d;--amber:#fbbf24;--amberbg:#3a2e12;--green:#4ade80;--greenbg:#12301d;--orange:#fdba74;--orangebg:#3b1f0e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background-image:radial-gradient(circle at 12% -5%,rgba(21,128,61,.14),transparent 38%),radial-gradient(circle at 92% 0,rgba(234,88,12,.13),transparent 34%),radial-gradient(rgba(21,128,61,.12) 1px,transparent 1px);
  background-size:auto,auto,22px 22px;background-repeat:no-repeat,no-repeat,repeat;background-position:0 0,0 0,0 0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* floating pill nav */
.nav{position:sticky;top:12px;z-index:30;margin:12px auto 0;max-width:1180px;padding:0 16px}
.pill{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;display:flex;align-items:center;gap:6px;padding:7px 8px 7px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px;white-space:nowrap;margin-right:8px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 13px;cursor:pointer;color:var(--muted);font-weight:600;border-radius:999px;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab.on{color:#fff;background:var(--brand-d)}
.tab .c{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:5px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.ib:hover{border-color:var(--brand);color:var(--brand)}

/* hero */
.hero{text-align:center;padding:54px 0 34px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--brand-d);box-shadow:var(--shadow)}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow{color:var(--brand)}}
.hero h1{font-size:clamp(30px,5.2vw,52px);line-height:1.1;margin:18px auto 12px;max-width:760px;font-weight:800;letter-spacing:-.02em}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:16px}
.cta{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.quote{margin-top:16px;font-size:13px;color:var(--muted)}
.pb{border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface);font-size:14px}
.pb.dark{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.pb.dark:hover{filter:brightness(1.25)}
.pb:hover{border-color:var(--brand)}

/* stats band */
.band{background:linear-gradient(135deg,#0b3d2a,#0f5a37 60%,#7c2d0d);border-radius:26px;padding:6px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;overflow:hidden}
.stat{padding:18px 20px;color:#fff}
.stat .n{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.stat .l{opacity:.85;font-size:13px;font-weight:600}
.stat .s{opacity:.6;font-size:12px;margin-top:2px}
.stat.red .n{color:#fdba74}.stat.green .n{color:#86efac}

.panel{display:none;margin-top:30px}.panel.on{display:block}
.ph{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ps{color:var(--muted);margin:0 0 18px}

/* chips, buttons */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.red{background:var(--redbg);color:var(--red);border-color:transparent}
.chip.amber{background:var(--amberbg);color:var(--amber);border-color:transparent}
.chip.green{background:var(--greenbg);color:var(--green);border-color:transparent}
.chip.orange{background:var(--orangebg);color:var(--orange);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.org{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.org:hover{filter:brightness(1.08);color:#fff}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* today */
.group h3{margin:22px 0 8px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h3:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.group.g3 h3:before{background:var(--accent)}.group.g2 h3:before{background:#f59e0b}.group.g1 h3:before{background:var(--brand)}
.item{display:grid;grid-template-columns:5px 1fr auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 16px;margin-bottom:9px;box-shadow:var(--shadow);align-items:center}
.item .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.g3 .bar{background:var(--accent)}.g2 .bar{background:#f59e0b}.g1 .bar{background:var(--brand)}
.item .t{font-weight:700}
.item .d{color:var(--muted);font-size:13px;margin-top:2px}
.item .tip{margin-top:7px;font-size:13px;background:var(--surface2);border-left:3px solid var(--brand);padding:6px 11px;border-radius:0 10px 10px 0}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:20px}

/* deal cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
.card .hd{display:flex;gap:10px;align-items:flex-start}
.card .nm{font-weight:700;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted)}
.sys{font-variant-numeric:tabular-nums;background:var(--orangebg);color:var(--orange);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.tl{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--greenbg) 0 50%,var(--orangebg) 50% 100%);margin:8px 0 2px}
.tl .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--grad);opacity:.9}
.tl .dl{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.tl .now{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--accent);transform:translateX(-2px)}
.tlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:7px 11px;font-size:13px}
.set b{min-width:78px}
.pbar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:40px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.pbar.red i{background:var(--red)}.pbar.amber i{background:var(--accent)}.pbar.green i{background:var(--green)}
.set .pc{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.lesson{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(6,20,13,.6);display:none;z-index:50;padding:16px;overflow:auto}
.ov.on{display:block}
.modal{background:var(--surface);max-width:900px;margin:20px auto;border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
.modal header{padding:16px 22px;background:linear-gradient(135deg,#0b3d2a,#0f5a37 65%,#9a3412);color:#fff;display:flex;align-items:center;gap:10px}
.modal header h2{margin:0;font-size:18px;flex:1}
.hx{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;width:32px;height:32px;cursor:pointer}
.mtabs{display:flex;gap:6px;padding:10px 22px 0;border-bottom:1px solid var(--line)}
.mt{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);cursor:pointer}
.mt.on{color:var(--brand);border-color:var(--accent)}
.mbody{padding:18px 22px;display:grid;gap:18px}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface2)}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.in{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 11px;width:100%;color:var(--ink)}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
textarea.in{min-height:64px;resize:vertical}
.pv{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.pv .v{font-weight:700;font-size:16px}
.setbox{border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--surface2);display:grid;gap:10px}
.logs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.logs .chip button{border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 4px}
.note{font-size:12.5px;color:var(--muted)}
.warn{font-size:12.5px;background:var(--amberbg);color:var(--amber);padding:8px 11px;border-radius:12px}
.chk{display:grid;gap:6px}
.chk div{display:flex;gap:8px;align-items:center;font-size:14px}
.chk .ok{color:var(--green)}.chk .no{color:var(--accent)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:99px}
.rowc{border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:10px;display:grid;gap:8px;position:relative}
.rowc .x{position:absolute;right:8px;top:6px}
.cnt{font-weight:800;font-variant-numeric:tabular-nums}

/* boxes */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}.item{grid-template-columns:5px 1fr}.item .act{grid-column:2}.logo span{display:none}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.box h3{margin:0 0 6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pol .box ul{margin:6px 0 0;padding-left:18px}.pol li{margin:3px 0}

/* guide */
.steps{display:grid;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:48px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.step .no{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;font-size:18px}
.step h3{margin:0 0 2px;font-size:17px}
.step .when{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.7px}
.step ul{margin:8px 0;padding-left:18px}.step li{margin:3px 0}
.step .tool{background:var(--surface2);border-left:3px solid var(--brand);border-radius:0 12px 12px 0;padding:7px 12px;font-size:13px;margin-top:8px}
.step .btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

/* glossary */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.gi b{color:var(--brand)}.gi .full{font-size:12px;color:var(--accent);font-weight:700}
.gi p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.gcat{grid-column:1/-1;margin:10px 0 0;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--brand-d);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="nav"><div class="pill">
  <div class="logo"><i>🧭</i><span>Go-live Compass</span></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="today">🔥 Hôm nay</button>
    <button class="tab" data-t="deals">📁 Deals</button>
    <button class="tab" data-t="active">📊 Nhập Active</button>
    <button class="tab" data-t="guide">🧭 Hướng dẫn</button>
    <button class="tab" data-t="glossary">📚 Từ điển</button>
    <button class="tab" data-t="policy">📖 Chính sách</button>
  </div>
  <button class="ib" id="bExport" title="Tải file sao lưu">⬇ Sao lưu</button>
  <button class="ib" id="bImport" title="Khôi phục từ file sao lưu">⬆ Khôi phục</button>
  <input type="file" id="fImport" accept=".json" hidden>
</div></div>

<div class="wrap">
  <div class="hero">
    <span class="eyebrow">CS · Go-live Compass</span>
    <h1 id="greet">Chào Quỳnh</h1>
    <p id="sub"></p>
    <div class="cta"><button class="pb dark" id="bNew">＋ Nhận deal mới</button><button class="pb" data-goto="guide">Xem hướng dẫn từng bước →</button></div>
    <div class="quote" id="quote"></div>
  </div>

  <div class="band" id="stats"></div>

  <section class="panel on" id="p-today"></section>
  <section class="panel" id="p-deals"></section>
  <section class="panel" id="p-active"></section>
  <section class="panel" id="p-guide"></section>
  <section class="panel" id="p-glossary"></section>
  <section class="panel" id="p-policy"></section>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const DAY=864e5;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>s?new Date(s+'T12:00:00'):null;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
const diff=(a,b)=>Math.round((a-b)/DAY);
const fmt=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'—';
const fmtS=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'):'—';
const TODAY=(()=>{const t=new Date();t.setHours(12,0,0,0);return t})();
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const uid=()=>'d'+Math.random().toString(36).slice(2,9);
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}

/* ============ data ============ */
const KEY='golive-compass-v1';
const SETS=['Work Ops','People Ops','Business Ops','Finance Ops','Other'];
const CSP_ST=[['none','Chưa làm'],['survey','Đã khảo sát KH'],['draft','Đã viết nháp CSP'],['sent','Đã duyệt & gửi KH']];

function mkSet(name,o={}){return Object.assign({name:name||'Work Ops',apps:'',value:'',users:'',plan:'',golive:'',output:0,log:[]},o)}
function mkCsp(){return {ctx:'',goals:[],team:[],phases:[],catalog:[],sessions:[]}}
function mkDeal(o={}){return Object.assign({id:uid(),sys:'',name:'',contract:'',start:'',startEst:false,nonSoft:false,ext:0,csp:'none',owner:'quynhvu',sets:[mkSet()],cause:'',lesson:'',notes:'',cspd:mkCsp()},o)}

function seed(){
  const L=(p)=>[{d:'2026-10-05',p}];
  const S=(apps,p)=>mkSet('Work Ops',{apps,log:L(p)});
  return [
    mkDeal({sys:'12061',name:'Công ty CP Quảng cáo và Thương mại Kim Quang',contract:'180826-01/863/HD-BASE',start:'2026-08-18',startEst:true,sets:[S('Wework',10.9)],cause:'Triển khai chưa gãy gọn',lesson:'Luôn phải có mục tiêu cho triển khai, kể cả ở 1st call / 1st meeting: KH sẽ nhận được giá trị gì?'}),
    mkDeal({sys:'12066',name:'Công ty TNHH ĐT TM DV và XNK Yên Thành',contract:'17082026-01/1396/HD-BASE',start:'2026-08-17',startEst:true,sets:[S('Workflow',1.1)],cause:'KH chưa sẵn sàng để triển khai'}),
    mkDeal({sys:'12088',name:'Công ty TNHH Tiến Lợi tỉnh Điện Biên',contract:'260826-1/1442/HD-BASE',start:'2026-08-26',startEst:true,sets:[S('Workflow',86.3)]}),
    mkDeal({sys:'12104',name:'Trường Tiểu học và THCS 915 Gia Sàng',contract:'260826-1/1037/HD-BASE',start:'2026-08-26',startEst:true,sets:[S('Wework',11.2)],cause:'KH có hệ thống công việc nhiều phân đoạn và delay'}),
    mkDeal({sys:'12118',name:'Công ty TNHH Duyến Toản',contract:'110926-01/863/HD-BASE',start:'2026-09-11',startEst:true,sets:[S('Wework',22.1)],cause:'KH chưa …'}),
    mkDeal({sys:'12155',name:'Hộ kinh doanh Vuông Tròn Pastry',contract:'220926-01/805/HD-BASE',start:'2026-09-22',startEst:true,sets:[S('Wework',33.9)],lesson:'Note vào trong sales / file CRM'}),
    mkDeal({sys:'12181',name:'Công ty TNHH MTV Xây dựng và Thương mại Châu Long',contract:'29092026-01/1396/HD-BASE',start:'2026-09-29',startEst:true,sets:[S('Wework',67.7)]}),

/* ============ policy engine ============ */
function seg(total){
  if(!total)return null;
  if(total<=20)return {k:'SA',base:21,per:0};
  if(total<=60)return {k:'MA',base:30,per:15};
  if(total<=100)return {k:'MA',base:35,per:15};
  if(total<=200)return {k:'MA',base:45,per:20};
  if(total<=500)return {k:'KA',base:60,per:30};
  return {k:'KA',base:75,per:30};
}
const TIER_TBL={'Work Ops':[2,1,1,3,3],'People Ops':[2,2,2,2,3],'Business Ops':[1,2,3,3,3]};
const BANDS={1:[[60,100],[30,60],[10,40]],2:[[50,100],[30,80],[10,50]],3:[[30,100],[15,80],[5,40]]};
const TIERNAME={1:'Daily Core',2:'Routine',3:'On-Demand',4:'Output Driven'};
function tierOf(name,users){
  const u=num(users)||50; const i=u<=15?0:u<=200?1:u<=500?2:u<=1000?3:4;
  return TIER_TBL[name]?TIER_TBL[name][i]:4;
}
function uScore(t,p){
  if(t===4)return null;
  for(const [thr,pts] of BANDS[t]) if(p>thr)return pts;
  return 0;
}
function need(t,o){
  if(t===4)return null;
  const b=[...BANDS[t]].reverse();
  for(const [thr,pts] of b) if(.7*pts+.3*o>=50)return {thr,pts};
  return false;
}
function measureStart(g){
  if(!g)return null;
  return g.getDate()<=10?g:new Date(g.getFullYear(),g.getMonth()+1,1,12);
}
function lastLog(s){return [...(s.log||[])].sort((a,b)=>a.d<b.d?1:-1)[0]}

function calc(d){
  const start=pd(d.start);
  const total=d.sets.reduce((a,s)=>a+num(s.value),0);
  const sg=seg(total);
  const n=d.sets.length;
  let base=null,extMax=null,ext=0,deadline=null,limit=null;
  if(sg){
    base=sg.base+(n>=2?(n-1)*sg.per:0)+(d.nonSoft?15:0);
    extMax=base; ext=Math.min(Math.max(0,num(d.ext)),extMax);
    if(start){deadline=addD(start,base+ext);limit=addD(start,base*2)}
  }
  const sets=d.sets.map(s=>{
    const live=!!s.golive, g=pd(s.golive);
    const ll=lastLog(s), p=ll?num(ll.p):null;
    const t=tierOf(s.name,s.users);
    const o=num(s.output);
    const u=(p==null)?null:uScore(t,p);
    const chs=t===4?o:(u==null?null:.7*u+.3*o);
    const nd=t===4?null:need(t,o);
    return {s,live,g,ll,p,t,u,o,chs,nd,ms:measureStart(g)};
  });
  const liveSets=sets.filter(x=>x.live&&x.chs!=null);
  const chs=liveSets.length?liveSets.reduce((a,x)=>a+x.chs,0)/liveSets.length:null;
  const allLive=sets.length&&sets.every(x=>x.live);
  return {start,total,sg,base,extMax,ext,deadline,limit,sets,chs,allLive,n};
}

/* ============ CSP completeness ============ */
const PH=/^\[.*\]$/;
const real=v=>{v=String(v==null?'':v).trim();return (!v||PH.test(v)||/^\[Ví dụ\]/i.test(v))?'':v};
function cspCheck(d){
  const c=d.cspd;
  const goals=c.goals.filter(g=>real(g.t)&&real(g.k));
  const side=(s)=>c.team.filter(t=>t.side&&t.side.toLowerCase().startsWith(s)&&real(t.name));
  const phases=c.phases.filter(p=>real(p.name));
  const cat=c.catalog.filter(r=>real(r.dept)&&real(r.items));
  const ses=c.sessions.filter(s=>real(s.session||s.n));
  const emptyPh=phases.map((p,i)=>({p,i})).filter(({i})=>!ses.some(s=>(+s.ph||0)===i)).map(({i})=>i+1);
  const items=[
    {k:'Bối cảnh & lý do triển khai',ok:real(c.ctx).length>=20,hint:'Viết 1–2 câu: vì sao KH cần Base ở thời điểm này'},
    {k:'Mục tiêu dự án (kèm chỉ số đo lường)',ok:goals.length>=1,hint:goals.length?'':'Cần ít nhất 1 mục tiêu có cả "Mục tiêu" và "Kết quả kỳ vọng"'},
    {k:'Ban dự án hai bên (≥1 KH và ≥1 Base)',ok:side('kh').length>=1&&side('base').length>=1,hint:'Thiếu '+(side('kh').length?'':'đầu mối Khách hàng ')+(side('base').length?'':'đầu mối Base')},
    {k:'Lộ trình tổng quan theo chặng',ok:phases.length>=1,hint:'Nhập tên chặng + thời gian dự kiến'},
    {k:'Danh mục số hóa (bóc tách nghiệp vụ)',ok:cat.length>=1,hint:'Cần ít nhất 1 dòng có phòng ban + quy trình số hóa'},
    {k:'Kế hoạch làm việc (các buổi)',ok:ses.length>=1&&emptyPh.length===0,hint:ses.length?`Chặng ${emptyPh.join(', ')} chưa có buổi nào`:'Chưa có buổi làm việc nào'},
  ];
  const done=items.filter(i=>i.ok).length;
  return {items,done,total:items.length,pct:Math.round(done/items.length*100),missing:items.filter(i=>!i.ok)};
}

/* ============ actions ("Hôm nay") ============ */
function actions(){
  const out=[];
  for(const d of DB.deals){
    const c=calc(d);
    const add=(sev,title,why,tip)=>out.push({sev,d,title,why,tip});
    if(!d.start)add(2,'Chưa có ngày nhận deal','Không có ngày bắt đầu thì không tính được hạn go-live & hạn CSP.','Mở deal, nhập ngày nhận deal (ngày ký HĐ / ngày nhận bàn giao).');
    else if(d.startEst)add(1,'Ngày nhận deal đang là ước tính từ mã hợp đồng','Xác nhận lại ngày thật BC bàn giao để mốc đúng.','Mở deal → sửa ngày → hệ thống tự bỏ cờ ước tính.');
    if(!c.sg)add(1,'Thiếu giá trị HĐ phần mềm','Cần giá trị từng bộ giải pháp để tính phân khúc (SA/MA/KA) và TTGL.','Nhập "Giá trị (triệu)" cho từng bộ trong deal.');
    // CSP
    if(d.start&&d.csp!=='sent'){
      const due=addD(c.start,14),left=diff(due,TODAY),ck=cspCheck(d);
      const sa=c.sg&&c.sg.k==='SA';
      const stTxt=CSP_ST.find(x=>x[0]===d.csp)[1];
      const miss=ck.missing.map(m=>m.k).join('; ');
      let tip;
      if(ck.missing.length)tip=(d.csp==='none'?'Đặt lịch khảo sát với PIC ngay (CSP chỉ viết được sau khảo sát). ':'')+'Còn thiếu: '+miss+'. Mở deal → tab CSP để dán/nhập tiếp.';
      else tip='Nội dung CSP đã đủ → xuất CSP.xlsx, trao đổi với BC rồi gửi KH, sau đó đổi trạng thái "Đã duyệt & gửi KH".';
      const why=`Nội dung CSP: ${ck.done}/${ck.total} mục · trạng thái: ${stTxt}. Quy định: CSP trong 14 ngày sau nhận deal.`;
      if(sa)add(1,'CSP (SA: không bắt buộc)','Khách SA do Solution Support giữ CSP; vẫn nên có mục tiêu Y1 ngắn.',tip);
      else{
        const sev=ck.missing.length?(left<=3?3:left<=7?2:1):(left<0?3:left<=3?2:1);
        const late=left<0?`quá hạn ${-left} ngày`:`hạn ${fmtS(due)}, còn ${left} ngày`;
        add(sev,ck.missing.length?`CSP ${late} — mới nhập ${ck.done}/${ck.total} mục`:`CSP đã đủ nội dung nhưng chưa duyệt & gửi KH (${late})`,why,tip);
      }
    }
    // go-live pending
    const pend=c.sets.filter(x=>!x.live);
    if(pend.length&&c.deadline){
      const left=diff(c.deadline,TODAY), over=TODAY>c.limit;
      const names=pend.map(x=>x.s.name+(x.s.apps?` (${x.s.apps})`:'')).join(', ');
      const room=c.extMax-c.ext;
      const ms=measureStart(TODAY);
      const mtip=TODAY.getDate()<=10?`Nếu go-live hôm nay: đo active ngay từ ${fmtS(TODAY)} tới cuối tháng.`:`Nếu go-live hôm nay (sau ngày 10): kỳ đo active bắt đầu 01/${String(ms.getMonth()+1).padStart(2,'0')} → còn thời gian "làm nóng" user trước khi bị đo.`;
      if(over)add(3,`Quá 200% định mức: ${names}`,`Doanh thu bộ này sẽ vào CR1 các kỳ sau cho tới khi go-live. Hạn gốc ${fmt(c.deadline)}.`,'Ưu tiên cao nhất: chốt go-live hoặc báo lead về hướng xử lý.');
      else if(left<0)add(3,`Quá hạn go-live ${-left} ngày: ${names}`,`Hạn ${fmt(c.deadline)}. Còn tối đa ${room} ngày gia hạn lũy kế; mốc 200% là ${fmt(c.limit)}.`,room>0?'Tạo đề xuất gia hạn trên hệ thống nếu có lý do khách quan (CR bộ này sẽ được tách khỏi kỳ). '+mtip:'Đã hết hạn mức gia hạn → phải kéo go-live. '+mtip);
      else if(left<=14)add(left<=7?3:2,`Còn ${left} ngày tới hạn go-live: ${names}`,`Hạn ${fmt(c.deadline)}. Kỳ CR: tháng ${c.deadline.getMonth()+1}/${c.deadline.getFullYear()}.`,(left<=7&&room>0?'Nếu KH chưa sẵn sàng, tạo đề xuất gia hạn TRƯỚC hạn để CR không bị kéo xuống. ':'')+mtip);
      else add(1,`Chưa go-live: ${names}`,`Hạn ${fmt(c.deadline)} (còn ${left} ngày). Tiến độ thời gian: ${Math.round((TODAY-c.start)/(c.deadline-c.start)*100)}%.`,'Mốc giữa chặng: tới khoảng 50% thời gian phải đào tạo xong user chính & có job thật đầu tiên.');
    }
    // live sets
    for(const x of c.sets.filter(x=>x.live)){
      const nm=x.s.name;
      if(x.p==null)add(2,`${nm}: chưa có số Active`,'Lấy số từ Power BI để theo dõi sức khỏe.','Vào tab "Nhập Active" dán số theo System ID.');
      else{
        const age=diff(TODAY,pd(x.ll.d));
        if(age>14)add(2,`${nm}: số Active đã cũ ${age} ngày`,`Gần nhất ${x.p}% ngày ${fmt(pd(x.ll.d))}.`,'Cập nhật lại từ Power BI.');
        if(x.chs!=null&&x.chs<50){
          let tip;
          if(x.t===4)tip='Bộ Output-driven: điểm = % Output hoàn thành. Chốt thêm/hoàn thành các mục Output trong CSP.';
          else if(x.nd===false)tip='Dù Active cao cũng chưa đủ 50 vì Output thấp → nâng % Output trong CSP.';
          else tip=`Cần Active > ${x.nd.thr}% (hiện ${x.p}%)`+(x.o<100?` — hoặc nâng Output (đang ${x.o}%) để hạ ngưỡng cần thiết.`:'.');
          add(3,`${nm}: CHS_CS ước tính ${Math.round(x.chs)} < 50`,`Active ${x.p}% (Tier ${x.t}: ${TIERNAME[x.t]}), Output ${x.o}%. Dưới 50 là deal không được tính "thành công" cho SRR/commission.`,tip);
        }
      }
      if(x.ms&&x.ms>TODAY)add(1,`${nm}: kỳ đo Active bắt đầu ${fmt(x.ms)}`,'Trước ngày này số Active chưa bị tính vào CHS.','Dùng khoảng thời gian này để ép user login hằng ngày.');
      if(x.g){
        for(const [m,lab] of [[1,'SRR_1'],[4,'SRR_4']]){
          const dt=addM(x.g,m),l=diff(dt,TODAY);
          if(l>=-3&&l<=14)add(l<=5?3:2,`${nm}: mốc ${lab} ${l<0?'vừa qua':'sắp tới'} (${fmt(dt)})`,'Cuối tháng đó CHS_CS_T phải ≥ 50 để deal tính là go-live thành công.','Kiểm tra Active + Output ngay tuần này.');
        }
        const mo=diff(TODAY,x.g)/30;
        if(mo>=5&&mo<=10)add(1,`${nm}: đang trong giai đoạn "The Gap" (tháng 6–10)`,'Dễ chững lại ở First Value.','Đặt QBR / chủ động đề xuất use-case Y2.');
      }
    }
  }
  return out.sort((a,b)=>b.sev-a.sev);
}

function normSet(t){
  t=t.toLowerCase();
  if(/work|wework|request|service|workflow/.test(t))return 'Work Ops';
  if(/people|hrm|hr\b|payroll|checkin/.test(t))return 'People Ops';
  if(/business|crm|sales/.test(t))return 'Business Ops';
  if(/finance|income|expense/.test(t))return 'Finance Ops';
  return null;
}
let PARSED=[];
function parsePaste(txt,date){
  const rows=[];
  for(const line of txt.split(/\r?\n/)){
    if(!line.trim())continue;
    const m=line.match(/\b(\d{1,2}[.,]?\d{3,4})\b/);
    const pm=[...line.matchAll(/(\d+(?:[.,]\d+)?)\s*%/g)].pop();
    if(!m||!pm){rows.push({line,err:'Không đọc được System ID hoặc %'});continue}
    const sys=m[1].replace(/[.,]/g,'');
    const p=parseFloat(pm[1].replace(',','.'));
    const d=DB.deals.find(x=>String(x.sys).replace(/[.,]/g,'')===sys);
    if(!d){rows.push({line,sys,p,err:'Không có deal mã '+sys});continue}
    const sn=normSet(line);
    let si=sn?d.sets.findIndex(s=>s.name===sn):(d.sets.length===1?0:-1);
    if(si<0){rows.push({line,sys,p,d,err:'Deal có nhiều bộ — ghi rõ tên bộ (Work Ops / People Ops…)'});continue}
    rows.push({line,sys,p,d,si,date});
  }
  return rows;
}

/* ============ CSP paste parser (dán từ Excel / Google Sheets) ============ */
function parseTSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=ch }
    else if(ch==='"'&&f===''){q=true}
    else if(ch==='\t'){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f='' }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function parseCSP(text){
  const rows=parseTSV(text).map(r=>r.map(c=>c.trim()));
  const out={ctx:'',goals:[],team:[],phases:[],catalog:[],sessions:[],barPhases:{},meta:{}};
  let mode='',curPh=0,wantCtx=false;
  const cell=(r,i)=>real(r[i]||'');
  for(const r of rows){
    const first=r.find(x=>x)||'';
    if(!first)continue;
    const a=r[0]||'';
    let m;
    if(/^CUSTOMER SUCCESS PLAN/i.test(first)){mode='';continue}
    if((m=first.match(/^Khách hàng:\s*(.*?)\s*\|\s*(?:Người phụ trách[^:]*|PIC Base)\s*:\s*(.*?)\s*\|\s*(?:Ngày[^:]*)\s*:\s*(.*)$/i))){out.meta={customer:m[1],pic:m[2],date:m[3]};continue}
    if(/^PHẦN 1/i.test(first)){mode='p1';continue}
    if(/^PHẦN 2/i.test(first)){mode='catalog';continue}
    if(/^PHẦN 3/i.test(first)){mode='sessions';continue}
    if(/^0\.\s*Bối cảnh/i.test(first)){mode='ctx';wantCtx=true;continue}
    if(/^1\.\s*Mục tiêu/i.test(first)){mode='goals';continue}
    if(/^3\.\s*Ban dự án/i.test(first)){mode='team';continue}
    if(/^2\.\s*Lộ trình/i.test(first)){mode='roadmap';continue}
    if((m=first.match(/CHẶNG\s*(\d+)\s*[:：]\s*(.*?)\s*[—–-]+\s*Thời gian[^:]*:\s*(.*)$/i))){
      curPh=(+m[1]||1)-1;out.barPhases[curPh]={name:real(m[2]),time:real(m[3])};mode='sessions';continue}
    if(/^(STT|Chặng|Trạng thái)$/i.test(a)&&/^(STT|Chặng|Trạng thái)$/i.test(first))continue;
    if(mode!=='ctx'&&r.some(c=>/^\[Ví dụ\]/i.test(c)))continue; // bỏ nguyên dòng ví dụ của template
    if(mode==='ctx'&&wantCtx){const v=real(first);if(v)out.ctx=v;wantCtx=false;continue}
    if(mode==='goals'&&/^\d+$/.test(a)){const t=cell(r,1),k=cell(r,6);if(t||k)out.goals.push({t,k});continue}
    if(mode==='team'&&/^\d+$/.test(a)){const x={side:cell(r,1),role:cell(r,2),name:cell(r,4),unit:cell(r,6),duty:cell(r,8)};if(x.name||x.role)out.team.push(x);continue}
    if(mode==='roadmap'&&/^\d+$/.test(a)){const x={name:cell(r,1),time:cell(r,5),goal:cell(r,7)};if(x.name||x.time)out.phases.push(x);continue}
    if(mode==='catalog'&&/^\d+$/.test(a)){const x={dept:cell(r,1),problem:cell(r,2),items:cell(r,4),prio:cell(r,6),pic:cell(r,7),app:cell(r,8),status:cell(r,9),note:cell(r,10)};if(x.dept||x.items)out.catalog.push(x);continue}
    if(mode==='sessions'&&/(buổi|bổ sung)/i.test(r[1]||'')){
      const x={status:cell(r,0),session:r[1],date:cell(r,2),time:cell(r,3),form:cell(r,4),who:cell(r,5),content:cell(r,7),out:cell(r,9),ph:curPh};
      if(x.date||x.who||x.content||x.out||real(x.status))out.sessions.push(x);continue}
  }
  if(!out.phases.length)Object.keys(out.barPhases).sort((x,y)=>x-y).forEach(i=>out.phases[i]=out.barPhases[i]);
  out.phases=out.phases.filter(Boolean).map(p=>({name:p.name||'',time:p.time||'',goal:p.goal||''}));
  return out;
}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0,cl=0;
  for(const f of files){
    const nb=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(lh,nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(ch,nb);cl+=46+nb.length;off+=30+nb.length+data.length;
  }
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

   {name:'[Content_Types].xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},

   {name:'xl/workbook.xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="CSP" sheetId="1" r:id="rId1"/></sheets></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:'xl/styles.xml',text:TPL_STYLES},
   {name:'xl/worksheets/sheet1.xml',text:x}
  ];
  return zipBlob(files);
}
function exportCSP(d){
  if(!d)return;
  const blob=buildCspBook(d);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`CSP_${(d.name||'KH').replace(/[^\p{L}\p{N}]+/gu,'_').slice(0,40)}_${iso(TODAY)}.xlsx`;
  document.body.appendChild(a);a.click();a.remove();
  toast('Đã tạo file CSP theo template của bạn');
}

render();
